<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swim Tap Race — Presenter</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="race-page">
  <header class="race-header">
    <div>
      <div class="eyebrow">WELLBEING MOMENT</div>
      <h1>Swim Tap Race 🏊</h1>
      <p id="connectionStatus" role="status">Connecting to race…</p>
      <p id="joinText">Players: open this site on your phone and join the race.</p>
    </div>
    <aside class="join-panel" aria-label="Join the race">
      <div id="joinQr" role="img" aria-label="QR code to join the race"></div>
      <div>
        <strong>Scan to join</strong>
        <p id="joinHint">Open the camera on your phone.</p>
        <a id="joinLink"></a>
        <label id="networkChoice" class="hidden">Network address
          <select id="joinNetwork" aria-label="Network address"></select>
        </label>
      </div>
    </aside>
    <div class="presenter-controls">
      <form id="presenterLogin" class="presenter-login">
        <label for="presenterKey">Presenter key</label>
        <input id="presenterKey" type="password" autocomplete="current-password" maxlength="256" required>
        <button type="submit">Unlock controls</button>
        <p id="presenterAuthStatus" role="status"></p>
      </form>
      <div id="presenterActions" class="presenter-actions hidden">
        <button id="startBtn" class="primary" type="button" disabled>Start race</button>
        <button id="resetBtn" type="button" disabled>Reset</button>
        <button id="clearBtn" type="button" disabled>Clear players</button>
      </div>
    </div>
  </header>

  <main class="race-main">
    <section class="scoreboard">
      <div id="countdown" class="countdown hidden"></div>
      <div id="goBurst" class="go-burst hidden">GO!</div>
      <div id="winnerBanner" class="winner hidden"></div>
      <div id="lanes" class="lanes">
        <div class="empty-state">Waiting for swimmers to join…</div>
      </div>
    </section>
  </main>

  <footer class="race-footer">
    <span id="playerCount">0 swimmers</span>
    <span>Tap to Swim.</span>
  </footer>

  <script src="/vendor/qrcode.js"></script>
  <script src="/join.js"></script>
  <script type="module" src="/race.js"></script>
</body>

</html>
